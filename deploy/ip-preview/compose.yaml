services:
  postgres:
    image: postgres:17-alpine
    env_file: /opt/jupiter/secrets/ip-preview.env
    volumes:
      - jupiter-preview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: /opt/jupiter/secrets/ip-preview.env
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    volumes:
      - jupiter-preview-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    env_file: /opt/jupiter/secrets/ip-preview.env
    command: server /data
    volumes:
      - jupiter-preview-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: /opt/jupiter/secrets/ip-preview.env
    command: pnpm --filter @jupiter/api migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: /opt/jupiter/secrets/ip-preview.env
    environment:
      NODE_ENV: development
      API_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: /opt/jupiter/secrets/ip-preview.env
    environment:
      NODE_ENV: development
      JUPITER_WORKER_ENABLED: "true"
    command: node dist/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8188:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jupiter-preview-postgres:
  jupiter-preview-redis:
  jupiter-preview-minio:
