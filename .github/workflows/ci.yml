name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Ephemeral CI-only database, not a connection to any deployed environment.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jupiter_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jupiter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-ephemeral@127.0.0.1:5432/jupiter_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve their published dist declarations. A clean
      # checkout has no dist artifacts; build topologically before noEmit checks.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prepare isolated CI schema
        run: pnpm --filter @jupiter/api migrate
      - run: pnpm test
